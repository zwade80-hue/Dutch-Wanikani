<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dutch Vocab</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#8a5cf6"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root{
      --bg:#07071a;
      --surface:#0e0e26;
      --surface2:#13132e;
      --border:#ffffff0d;
      --border2:#ffffff18;
      --text:#eeeef8;
      --muted:#6b7280;
      --purple:#7c3aed;
      --purple-bright:#8b5cf6;
      --purple-glow:#7c3aed33;
      --blue:#2563eb;
      --green:#16a34a;
      --red:#dc2626;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:url('benelux.png') no-repeat center 8%;background-size:45% auto;opacity:0.035}
    body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 70% 45% at 15% 5%,#7c3aed14 0%,transparent 65%),
                radial-gradient(ellipse 55% 40% at 85% 85%,#2563eb10 0%,transparent 65%)}
    #app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:1.5rem 1.25rem}

    /* NAV */
    nav{display:flex;gap:3px;margin-bottom:1.75rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
    nav button{flex:1;background:none;border:none;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;padding:7px 8px;border-radius:8px;transition:all .16s;font-family:inherit;letter-spacing:.01em}
    nav button:hover{color:var(--text);background:#ffffff07}
    nav button.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 4px #00000050}

    /* TYPE */
    h2{font-size:20px;font-weight:700;margin-bottom:3px;letter-spacing:-.025em}
    p.sub{color:var(--muted);font-size:13px;margin-bottom:1.5rem;font-weight:400}
    button{cursor:pointer;font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--border);padding:11px;transition:all .14s;font-weight:500}
    button:disabled{opacity:0.3;cursor:not-allowed}
    button:not(:disabled):active{transform:scale(.975)}

    /* METRICS */
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.1rem}
    .metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;transition:border-color .18s}
    .metric:hover{border-color:var(--border2)}
    .metric .label{font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em}
    .metric .value{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1}

    /* BUTTONS */
    .btn-row{display:flex;gap:8px;margin-bottom:1.1rem}
    .btn-review{flex:1;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border:none;font-size:14px;font-weight:700;padding:14px;border-radius:12px;box-shadow:0 2px 16px #2563eb28;letter-spacing:-.01em}
    .btn-review:not(:disabled):hover{filter:brightness(1.1);box-shadow:0 4px 24px #2563eb44}
    .btn-lesson{flex:1;background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;border:none;font-size:14px;font-weight:700;padding:14px;border-radius:12px;box-shadow:0 2px 16px #7c3aed28;letter-spacing:-.01em}
    .btn-lesson:not(:disabled):hover{filter:brightness(1.1);box-shadow:0 4px 24px #7c3aed44}
    .btn-secondary{background:var(--surface2);color:var(--text);width:100%;margin-top:10px;border:1px solid var(--border2)}
    .btn-secondary:hover{background:#1a1a38;border-color:#ffffff22}
    .btn-back{background:none;border:none;color:var(--muted);font-size:13px;padding:0;font-weight:500}
    .btn-back:hover{color:var(--text)}

    /* CARDS */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.9rem 1.1rem;margin-bottom:.75rem}
    .card-label{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em}

    /* LEVEL BAR */
    .level-bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.875rem}
    .level-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .level-title{font-size:14px;font-weight:700;letter-spacing:-.015em}
    .level-pct{font-size:11.5px;color:var(--muted);font-weight:500}
    .level-bar{height:5px;background:#ffffff09;border-radius:99px;overflow:hidden}
    .level-bar-fill{height:100%;background:linear-gradient(90deg,#6d28d9,#a78bfa);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

    /* PILLS */
    .stage-pills{display:flex;gap:6px;flex-wrap:wrap}
    .pill{display:flex;align-items:center;gap:6px;background:#ffffff06;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500}
    .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

    /* SESSION */
    .session-wrap{max-width:500px;margin:0 auto;padding:0 .5rem}
    .session-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .session-progress{height:3px;background:#ffffff07;border-radius:99px;margin-bottom:2.5rem;overflow:hidden}
    .session-progress-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#3b82f6);border-radius:99px;transition:width .35s}
    .stage-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.03em}
    .direction-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;text-align:center}
    .big-word{font-size:54px;font-weight:800;margin:.75rem 0 .4rem;text-align:center;letter-spacing:-.035em;line-height:1.05}
    .prompt-label{font-size:13px;color:var(--muted);margin-bottom:1.75rem;text-align:center;font-weight:500}

    #answer-input{width:100%;padding:14px 16px;font-size:17px;border-radius:12px;background:var(--surface);color:var(--text);outline:none;font-family:inherit;border:1.5px solid var(--border2);transition:border-color .14s,box-shadow .14s;font-weight:500}
    #answer-input:focus{border-color:#7c3aed99;box-shadow:0 0 0 3px var(--purple-glow)}
    #answer-input.correct{border-color:#16a34a;box-shadow:0 0 0 3px #16a34a1e}
    #answer-input.wrong{border-color:#dc2626;box-shadow:0 0 0 3px #dc26261e}

    .feedback{margin:.75rem 0;padding:12px 16px;border-radius:10px;font-size:13.5px;text-align:center;font-weight:600}
    .feedback.correct{background:#14532d1a;color:#4ade80;border:1px solid #16a34a2e}
    .feedback.wrong{background:#7f1d1d1a;color:#f87171;border:1px solid #dc26262e}

    .check-btn{width:100%;margin-top:10px;color:#fff;border:none;font-size:15px;font-weight:700;padding:15px;border-radius:12px;letter-spacing:-.01em}

    .stats-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 0;margin-top:1.25rem;display:flex;font-size:13px;font-weight:700}
    .stats-bar span{flex:1;text-align:center;padding:2px 0}
    .stats-bar span:nth-child(1){color:#4ade80}
    .stats-bar span:nth-child(2){color:#f87171;border-left:1px solid var(--border);border-right:1px solid var(--border)}
    .stats-bar span:nth-child(3){color:var(--muted)}

    /* DONE / LEVELUP */
    .done-screen{text-align:center;padding:4rem 1.5rem}
    .done-screen .emoji{font-size:56px;margin-bottom:1.25rem}
    .done-screen h2{font-size:22px;letter-spacing:-.02em}
    .levelup-screen{text-align:center;padding:4rem 1.5rem}
    .levelup-num{font-size:100px;font-weight:800;background:linear-gradient(135deg,#7c3aed,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin:1rem 0;letter-spacing:-.05em}

    /* BROWSE */
    .browse-level-section{margin-bottom:2rem}
    .browse-level-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .browse-level-badge{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.03em}
    .browse-level-title{font-size:13px;font-weight:500;color:var(--muted)}
    .browse-level-lock{font-size:12px;color:#374151;margin-left:auto}
    .browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
    .browse-card{border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;border:1px solid transparent;transition:transform .12s,box-shadow .12s}
    .browse-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px #00000050}
    .browse-card .dutch{font-size:14px;font-weight:700;margin-bottom:2px;letter-spacing:-.01em}
    .browse-card .english{font-size:10px;opacity:.6;font-weight:500}
    .browse-card.locked{background:#0e0e26;border-color:#ffffff06;opacity:.3;cursor:default}
    .browse-card.locked:hover{transform:none;box-shadow:none}


    /* ── INFO PANEL ── */
    .info-panel{
      position:fixed;bottom:0;left:0;right:0;z-index:200;
      background:#0e0e26;border-top:1px solid var(--border2);
      border-radius:20px 20px 0 0;
      box-shadow:0 -8px 40px #00000080;
      max-height:75vh;overflow-y:auto;
      transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    }
    .info-panel.open{transform:translateY(0)}
    .info-panel-tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:#0e0e26;z-index:1;border-radius:20px 20px 0 0;overflow:hidden}
    .info-panel-tab{flex:1;padding:13px 8px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;border-radius:0;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.01em}
    .info-panel-tab.active{color:var(--text);border-bottom-color:var(--purple-bright)}
    .info-panel-tab:hover{color:var(--text);background:#ffffff05}
    .info-panel-body{padding:1.25rem 1.5rem 2rem}
    .info-section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    .info-content{font-size:14px;line-height:1.7;color:#c4c4d8}
    .info-content b{color:var(--text);font-weight:600}
    .info-pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-right:6px;margin-bottom:4px}
    .info-toggle-btn{
      display:flex;align-items:center;justify-content:center;gap:6px;
      width:100%;margin-top:10px;padding:11px;
      background:#ffffff07;border:1px solid var(--border);
      border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;
      cursor:pointer;transition:all .15s;
    }
    .info-toggle-btn:hover{background:#ffffff0f;color:var(--text)}
    .info-toggle-btn.panel-open{color:var(--purple-bright);border-color:var(--purple-bright)44;background:var(--purple-glow)}
    .loading-dots::after{content:'...';animation:dots 1.2s steps(4,end) infinite}
    @keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}

    /* ── LESSON PICKER ── */
    .picker-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1rem}
    .picker-word{
      padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;
      cursor:pointer;border:1.5px solid transparent;
      background:#1a1a3a;color:var(--muted);
      transition:all .14s;letter-spacing:-.01em;user-select:none;
    }
    .picker-word:hover{border-color:var(--border2);color:var(--text)}
    .picker-word.selected{background:var(--purple-glow);border-color:var(--purple-bright);color:var(--purple-bright)}
    .picker-word.selected:hover{background:#7c3aed44}
    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:#00000090;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;animation:fadein .14s}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    .modal{background:#111130;border-radius:20px;padding:1.75rem;max-width:390px;width:100%;border:1px solid var(--border2);box-shadow:0 32px 80px #00000099;animation:slideup .16s cubic-bezier(.4,0,.2,1)}
    @keyframes slideup{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-word{font-size:50px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:-.035em}
    .modal-article{font-size:14px;color:var(--muted);text-align:center;margin-bottom:5px;font-weight:500}
    .modal-english{font-size:19px;color:#9ca3af;text-align:center;margin-bottom:1.25rem;font-weight:600}
    .modal-row{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--border);font-weight:500}
    .modal-row:last-child{border-bottom:none}
    .modal-row span:first-child{color:var(--muted)}
    .modal-close{width:100%;margin-top:1.1rem;background:#1a1a3a;color:var(--text);border:1px solid var(--border2);font-weight:600}
  </style>
</head>
<body>
<div id="app"><p style="text-align:center;padding:3rem;color:#888">Loading...</p></div>
<script>
const SRS_STAGES   = ["Apprentice 1","Apprentice 2","Apprentice 3","Apprentice 4","Guru 1","Guru 2","Master","Enlightened","Burned"];
const SRS_INTERVALS= [4,8,24,72,168,336,730,2160,Infinity];
const STAGE_COLORS = {"Apprentice 1":"#e85d9b","Apprentice 2":"#e85d9b","Apprentice 3":"#e85d9b","Apprentice 4":"#e85d9b","Guru 1":"#8a5cf6","Guru 2":"#8a5cf6","Master":"#2563eb","Enlightened":"#0ea5e9","Burned":"#16a34a"};
const WORDS_PER_LEVEL = 83;
const MAX_LEVEL = 60;
const GURU_THRESHOLD  = 0.9;
const HOUR_MS = 3600000;

// ── SETTINGS ───────────────────────────────────────────────────────────────
let settings = {
  lessonsPerDay: 15,
  reviewOrder: "shuffle",   // "shuffle" | "level" | "stage"
  lightMode: false,
  autoPlay: true,
  slowAudio: false,
};
function loadSettings(){
  const s=localStorage.getItem("dutch-settings");
  if(s) settings={...settings,...JSON.parse(s)};
  applyTheme();
}
function saveSettings(){
  localStorage.setItem("dutch-settings",JSON.stringify(settings));
  applyTheme();
}
function applyTheme(){
  if(settings.lightMode){
    document.body.style.background="#f5f5f0";
    document.body.style.color="#1a1a2e";
  } else {
    document.body.style.background="#0a0a1a";
    document.body.style.color="#f0f0f0";
  }
}

let VOCAB=[], progress={}, currentLevel=1;
let screen="dashboard", selectedWord=null;
let reviewQueue=[], reviewIdx=0;
let lessonQueue=[], lessonIdx=0, lessonPhase="learn";
let input="", feedback=null;
let sessionCorrect=0, sessionTotal=0, sessionDone=false, showLevelUp=false;
let sessionStartTime=null;

function save(){
  localStorage.setItem("dutch-progress",JSON.stringify(progress));
  localStorage.setItem("dutch-level",currentLevel);
}
function load(){
  loadSettings();
  const p=localStorage.getItem("dutch-progress"); if(p) progress=JSON.parse(p);
  currentLevel=parseInt(localStorage.getItem("dutch-level")||"1");
}

// ── WORD TYPE DETECTION ────────────────────────────────────────────────────
const KNOWN_ADJECTIVES = new Set([
  "good","bad","big","small","red","blue","new","old","hot","cold","fast","slow",
  "happy","sad","angry","tired","sick","healthy","clean","dirty","empty","full",
  "heavy","light","dark","bright","loud","quiet","hard","soft","warm","cool",
  "easy","difficult","important","famous","free","busy","rich","poor","safe",
  "dangerous","beautiful","ugly","tall","short","long","wide","narrow","deep",
  "shallow","thick","thin","sharp","flat","round","straight","wrong","right",
  "true","false","real","fake","late","early","near","far","open","closed",
  "young","strong","weak","fresh","frozen","raw","cooked","sweet","sour","salty",
  "spicy","creamy","tasty","boring","funny","scary","strange","normal","special",
  "different","same","next","last","first","second","certain","possible","necessary",
  "available","reliable","mutual","daily","nervous","lonely","calm","patient",
  "honest","friendly","adventurous","notorious","indifferent","impressive",
  "valuable","intense","unique","pleasant","notorious","savory","tender",
  "slippery","creamy","sunny","cozy","relieved","satisfied","ready","finished",
  "greasy","expensive","cheap","lucky","careful","careless","efficient","accurate"
]);
const KNOWN_ADVERBS = new Set([
  "always","never","often","sometimes","usually","mostly","already","still",
  "just","also","too","very","really","quite","rather","almost","nearly",
  "soon","now","today","yesterday","tomorrow","here","there","together",
  "immediately","suddenly","slowly","quickly","carefully","clearly","loudly",
  "quietly","fluently","efficiently","accurately","recently","lately","early",
  "later","finally","eventually","probably","certainly","perhaps","maybe",
  "especially","actually","honestly","basically","generally","normally",
  "approximately","at least","by the way","indeed","nevertheless","otherwise",
  "therefore","however","although","enough","hardly","merely","only","even",
  "else","instead","rather","mostly","overall"
]);
const KNOWN_CONJUNCTIONS = new Set([
  "and","but","or","because","although","while","when","if","that","so",
  "however","therefore","nevertheless","otherwise","whether","until","before",
  "after","since","unless","except","despite","during","without","between",
  "among","each other","by the way"
]);
const KNOWN_PRONOUNS = new Set([
  "someone","everyone","nobody","anyone","something","everything","nothing",
  "each other","how much / how many"
]);

function detectType(word) {
  const eng = word.english.toLowerCase().trim();
  if(eng.startsWith("to ")) return "verb";
  const first = eng.split("/")[0].trim();
  if(first.startsWith("to ")) return "verb";
  if(KNOWN_ADVERBS.has(eng)||KNOWN_ADVERBS.has(first)) return "adverb";
  if(KNOWN_CONJUNCTIONS.has(eng)||KNOWN_CONJUNCTIONS.has(first)) return "other";
  if(KNOWN_PRONOUNS.has(eng)||KNOWN_PRONOUNS.has(first)) return "other";
  if(KNOWN_ADJECTIVES.has(eng)||KNOWN_ADJECTIVES.has(first)) return "adjective";
  if(eng.endsWith("ly")||first.endsWith("ly")) return "adverb";
  return "noun";
}

const TYPE_COLORS = { noun:"#2563eb", verb:"#e85d9b", adjective:"#f59e0b", adverb:"#16a34a", other:"#888" };
const TYPE_LABELS = { noun:"Noun", verb:"Verb", adjective:"Adjective", adverb:"Adverb", other:"Other" };

function getStreak(){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-streak-date");
  const count=parseInt(localStorage.getItem("dutch-streak")||"0");
  if(last===today) return count;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  if(last===yesterday) return count;
  return 0;
}
function updateStreak(){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-streak-date");
  const count=parseInt(localStorage.getItem("dutch-streak")||"0");
  if(last===today) return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  const newCount=last===yesterday?count+1:1;
  localStorage.setItem("dutch-streak",newCount);
  localStorage.setItem("dutch-streak-date",today);
}

function addStudyTime(ms){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-time-date");
  const total=last===today?parseInt(localStorage.getItem("dutch-time-today")||"0"):0;
  localStorage.setItem("dutch-time-date",today);
  localStorage.setItem("dutch-time-today",total+ms);
  const allTime=parseInt(localStorage.getItem("dutch-time-all")||"0");
  localStorage.setItem("dutch-time-all",allTime+ms);
}
function formatTime(ms){
  const m=Math.floor(ms/60000), h=Math.floor(m/60);
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}m`;
}

function recordAccuracy(wordId, correct){
  const key=`dutch-acc-${wordId}`;
  const data=JSON.parse(localStorage.getItem(key)||'{"c":0,"t":0}');
  data.t++; if(correct) data.c++;
  localStorage.setItem(key,JSON.stringify(data));
}
function getAccuracy(wordId){
  const data=JSON.parse(localStorage.getItem(`dutch-acc-${wordId}`)||'{"c":0,"t":0}');
  return data.t===0?null:Math.round(data.c/data.t*100);
}

function getUpcomingReviews(){
  const now=Date.now();
  const hours=[];
  for(let i=0;i<24;i++) hours.push(0);
  VOCAB.forEach(w=>{
    const p=progress[w.id];
    if(!p?.lessonDone) return;
    // only show reviews that are genuinely in the future (not already due)
    if(p.nextReview<=now) return;
    const hoursFromNow=Math.ceil((p.nextReview-now)/HOUR_MS);
    if(hoursFromNow>0&&hoursFromNow<=24) hours[hoursFromNow-1]++;
  });
  return hours;
}
function getDailyForecast(){
  const now=Date.now();
  const days=[];
  for(let d=0;d<7;d++){
    const start=now+d*86400000;
    const end=start+86400000;
    let count=0;
    VOCAB.forEach(w=>{
      const p=progress[w.id];
      if(!p?.lessonDone) return;
      if(p.nextReview>now&&p.nextReview>=start&&p.nextReview<end) count++;
    });
    const date=new Date(start);
    const label=d===0?"Today":d===1?"Tomorrow":date.toLocaleDateString("en-US",{weekday:"short"});
    days.push({label,count});
  }
  let running=dueReviews().length;
  days.forEach(d=>{ running+=d.count; d.total=running; });
  return days;
}

function initProgress(){
  VOCAB.forEach(w=>{if(!progress[w.id]) progress[w.id]={stage:0,nextReview:Date.now(),lessonDone:false};});
}
function wordsForLevel(lvl){ return VOCAB.slice((lvl-1)*WORDS_PER_LEVEL, lvl*WORDS_PER_LEVEL); }
function guruCount(lvl){ return wordsForLevel(lvl).filter(w=>progress[w.id]?.lessonDone&&progress[w.id]?.stage>=4).length; }
function levelProgress(lvl){ const w=wordsForLevel(lvl); return w.length?guruCount(lvl)/w.length:0; }
function checkLevelUp(){
  if(currentLevel>=MAX_LEVEL) return false;
  if(wordsForLevel(currentLevel+1).length===0) return false;
  if(levelProgress(currentLevel)>=GURU_THRESHOLD){
    currentLevel++; save(); return true;
  }
  return false;
}
function lessonsToday(){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-lastday");
  return last===today?parseInt(localStorage.getItem("dutch-lessonstoday")||"0"):0;
}
function availableLessons(){
  const rem=settings.lessonsPerDay-lessonsToday();
  if(rem<=0) return [];
  return wordsForLevel(currentLevel).filter(w=>!progress[w.id]?.lessonDone).slice(0,rem);
}
function dueReviews(){
  let due=VOCAB.filter(w=>progress[w.id]?.lessonDone&&progress[w.id]?.nextReview<=Date.now());
  if(settings.reviewOrder==="level") due.sort((a,b)=>a.id-b.id);
  else if(settings.reviewOrder==="stage") due.sort((a,b)=>progress[a.id].stage-progress[b.id].stage);
  return due;
}
function normalize(s){ return s.trim().toLowerCase().replace(/[^a-z ]/g,""); }
function getAcceptedAnswers(english){
  // Split on "/" and also on "b)" "2)" style separators, strip parenthetical junk
  let raw = english.replace(/[a-z0-9]\)\s*/gi," / ").replace(/\s+/g," ");
  return raw.split("/").map(x=>normalize(x)).filter(x=>x.length>0);
}
function similar(a,b){
  a=normalize(a);
  // check against all accepted forms of b
  const accepted=getAcceptedAnswers(b);
  if(accepted.some(x=>x===a)) return true;
  // fuzzy match against each accepted form (1 typo tolerance)
  return accepted.some(x=>{
    if(Math.abs(a.length-x.length)>2) return false;
    let d=0; for(let i=0;i<Math.max(a.length,x.length);i++) if(a[i]!==x[i]) d++;
    return d<=1;
  });
}

// ── USER SYNONYMS ──────────────────────────────────────────────────────────
function getSynonyms(wordId){
  return JSON.parse(localStorage.getItem(`dutch-syn-${wordId}`)||"[]");
}
function addSynonym(wordId, syn){
  syn=syn.trim().toLowerCase();
  if(!syn) return;
  const syns=getSynonyms(wordId);
  if(!syns.includes(syn)){ syns.push(syn); localStorage.setItem(`dutch-syn-${wordId}`,JSON.stringify(syns)); }
}
function removeSynonym(wordId, syn){
  const syns=getSynonyms(wordId).filter(s=>s!==syn);
  localStorage.setItem(`dutch-syn-${wordId}`,JSON.stringify(syns));
}
function similarWithSynonyms(a, b, wordId){
  if(similar(a,b)) return true;
  const syns=getSynonyms(wordId);
  const an=normalize(a);
  return syns.some(s=>s===an);
}

// ── AUDIO ──────────────────────────────────────────────────────────────────
function speak(text, lang="nl-NL"){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = settings.slowAudio ? 0.6 : 0.9;
  // try to find a Dutch voice
  const voices = speechSynthesis.getVoices();
  const dutch = voices.find(v=>v.lang==="nl-NL")||voices.find(v=>v.lang.startsWith("nl"));
  if(dutch) u.voice = dutch;
  speechSynthesis.speak(u);
}
function speakBtn(text, lang="nl-NL", size="15px"){
  return `<button onclick="event.stopPropagation();speak('${text.replace(/'/g,"\'")}','${lang}')"
    style="background:none;border:1px solid var(--border2);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:${size};cursor:pointer;transition:all .14s;line-height:1"
    title="Play audio">🔊</button>`;
}

function stageColor(w){ const p=progress[w.id]; if(!p?.lessonDone) return "#333"; return STAGE_COLORS[SRS_STAGES[p.stage]]||"#888"; }
function stageCounts(){ const c={}; SRS_STAGES.forEach(s=>c[s]=0); VOCAB.forEach(w=>{if(progress[w.id]?.lessonDone)c[SRS_STAGES[progress[w.id].stage]]++;}); return c; }

function finishSession(){
  if(sessionStartTime){ addStudyTime(Date.now()-sessionStartTime); updateStreak(); sessionStartTime=null; }
}

function startLessons(){
  lessonQueue=availableLessons(); if(!lessonQueue.length) return;
  lessonIdx=0; lessonPhase="learn"; input=""; feedback=null;
  sessionCorrect=0; sessionTotal=0; sessionDone=false; showLevelUp=false;
  sessionStartTime=Date.now();
  screen="lesson"; render();
}
function startReviews(){
  const due=dueReviews(); if(!due.length) return;
  reviewQueue=[];
  due.forEach(w=>{reviewQueue.push({word:w,type:"meaning"});reviewQueue.push({word:w,type:"dutch"});});
  for(let i=reviewQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[reviewQueue[i],reviewQueue[j]]=[reviewQueue[j],reviewQueue[i]];}
  reviewIdx=0; input=""; feedback=null;
  sessionCorrect=0; sessionTotal=0; sessionDone=false; showLevelUp=false;
  sessionStartTime=Date.now();
  screen="review"; render();
}

function checkAnswer(expected){
  const correct=similar(input,expected);
  feedback={correct,answer:expected};
  sessionTotal++; if(correct) sessionCorrect++;
  render();
  setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
}

function advanceReview(){
  feedback=null; input="";
  if(reviewIdx+1<reviewQueue.length){ reviewIdx++; render(); setTimeout(()=>document.getElementById("answer-input")?.focus(),50); }
  else{ finishSession(); const leveled=checkLevelUp(); save(); sessionDone=true; showLevelUp=leveled; render(); }
}
function submitReview(){
  if(feedback){ advanceReview(); return; }
  const{word,type}=reviewQueue[reviewIdx];
  const expected=type==="meaning"?word.english:word.dutch;
  const cur=progress[word.id];
  const correct=type==="meaning"?similarWithSynonyms(input,expected,word.id):similar(input,expected);
  const newStage=correct?Math.min(cur.stage+1,SRS_STAGES.length-1):Math.max(cur.stage-1,0);
  progress[word.id]={...cur,stage:newStage,nextReview:Date.now()+SRS_INTERVALS[newStage]*3600000};
  recordAccuracy(word.id,correct);
  save();
  checkAnswer(expected);
}

function advanceLesson(){
  feedback=null; input="";
  if(lessonPhase==="learn"){ lessonPhase="quiz-meaning"; render(); setTimeout(()=>document.getElementById("answer-input")?.focus(),50); return; }
  if(lessonPhase==="quiz-meaning"){ lessonPhase="quiz-dutch"; render(); setTimeout(()=>document.getElementById("answer-input")?.focus(),50); return; }
  if(lessonIdx+1<lessonQueue.length){ lessonIdx++; lessonPhase="learn"; render(); }
  else{
    lessonQueue.forEach(w=>{progress[w.id]={...progress[w.id],lessonDone:true,stage:0,nextReview:Date.now()+SRS_INTERVALS[0]*3600000};});
    const today=new Date().toDateString();
    const given=lessonsToday();
    localStorage.setItem("dutch-lastday",today);
    localStorage.setItem("dutch-lessonstoday",given+lessonQueue.length);
    finishSession(); const leveled=checkLevelUp(); save(); sessionDone=true; showLevelUp=leveled; render();
  }
}
function submitLesson(){
  if(feedback){ advanceLesson(); return; }
  const word=lessonQueue[lessonIdx];
  const expected=lessonPhase==="quiz-meaning"?word.english:word.dutch;
  if(lessonPhase==="quiz-meaning"){
    feedback={correct:similarWithSynonyms(input,expected,word.id),answer:expected};
  } else {
    feedback={correct:similar(input,expected),answer:expected};
  }
  sessionTotal++; if(feedback.correct) sessionCorrect++;
  render();
  setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
}

function navHTML(active){
  return `<nav>
    <button class="${active==="dashboard"?"active":""}" onclick="screen='dashboard';selectedWord=null;render()">Dashboard</button>
    <button class="${active==="browse"?"active":""}" onclick="screen='browse';render()">Browse</button>
    <button class="${active==="settings"?"active":""}" onclick="screen='settings';render()">Settings</button>
  </nav>`;
}

function render(){
  const app=document.getElementById("app");

  if(showLevelUp){
    app.innerHTML=`<div class="levelup-screen">
      <div style="font-size:64px">🎉</div>
      <p style="color:#888;margin-top:1rem">Level up!</p>
      <div class="levelup-num">${currentLevel}</div>
      <p style="color:#888;margin-bottom:2rem">Level ${currentLevel} unlocked!</p>
      <button class="btn-secondary" style="max-width:200px;margin:0 auto" onclick="showLevelUp=false;screen='dashboard';render()">Continue</button>
    </div>`; return;
  }

  if(sessionDone){
    app.innerHTML=`<div class="done-screen">
      <div class="emoji">🎉</div>
      <h2>${screen==="lesson"?"Lessons complete!":"Reviews complete!"}</h2>
      <p style="color:#888;margin:.5rem 0 1.5rem">${sessionCorrect}/${sessionTotal} correct (${sessionTotal>0?Math.round(sessionCorrect/sessionTotal*100):0}%)</p>
      <button class="btn-secondary" onclick="screen='dashboard';sessionDone=false;render()">Back to dashboard</button>
    </div>`; return;
  }

  if(screen==="dashboard") renderDashboard(app);
  else if(screen==="browse") renderBrowse(app);
  else if(screen==="lesson") renderLesson(app);
  else if(screen==="review") renderReview(app);
  else if(screen==="settings") renderSettings(app);
  else if(screen==="picker") renderPicker(app);
}

    </div>`;

    return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:0.5px solid #1a1a2e">

      </div>
      <span style="font-size:12px;color:#16a34a;width:36px;text-align:right;flex-shrink:0">+${d.count}</span>
      <span style="font-size:12px;color:#888;width:32px;text-align:right;flex-shrink:0">${d.total}</span>
    </div>`;
  }).join("");

  app.innerHTML=`${navHTML("dashboard")}
    <h2>🇳🇱 Dutch Vocab</h2><p class="sub">Spaced repetition system</p>

    <div class="level-bar-wrap">
      <div class="level-header"><span class="level-title">Level ${currentLevel} / ${MAX_LEVEL}</span><span class="level-pct">${gurus}/${needed} Guru to level up</span></div>
      <div class="level-bar"><div class="level-bar-fill" style="width:${Math.min(pct,100)}%"></div></div>
    </div>

    <div class="grid-3">
      <div class="metric"><div class="label">Reviews due</div><div class="value" style="color:#2563eb">${due}</div></div>
      <div class="metric"><div class="label">Lessons today</div><div class="value" style="color:#8a5cf6">${lessons}</div></div>
      <div class="metric"><div class="label">Words burned</div><div class="value" style="color:#16a34a">${burned}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem">
      <div class="metric"><div class="label">🔥 Streak</div><div class="value" style="color:#f59e0b">${streak}<span style="font-size:14px;color:#888"> days</span></div></div>
      <div class="metric"><div class="label">🎯 Accuracy</div><div class="value" style="color:#e85d9b">${overallAcc!==null?overallAcc+"%":"—"}</div></div>
      <div class="metric"><div class="label">⏱ Today</div><div class="value" style="color:#0ea5e9;font-size:20px">${todayMs>0?formatTime(todayMs):"—"}</div></div>

function renderBrowse(app){
  const maxLevel=Math.ceil(VOCAB.length/WORDS_PER_LEVEL);
  let html="";
  for(let lvl=1;lvl<=maxLevel;lvl++){
    const words=wordsForLevel(lvl), unlocked=lvl<=currentLevel;
    const guruPct=Math.round(levelProgress(lvl)*100);

    const groups={noun:[],verb:[],adjective:[],adverb:[],other:[]};
    words.forEach(w=>groups[detectType(w)].push(w));

    let groupsHTML="";
    for(const [type,ws] of Object.entries(groups)){
      if(!ws.length) continue;
      const color=TYPE_COLORS[type];
      const cards=ws.map(w=>{
        const wcolor=stageColor(w), locked=!unlocked;
        return `<div class="browse-card${locked?" locked":""}" style="${locked?"":"background:"+wcolor+"22;border-color:"+wcolor+"44"}" onclick="${locked?"":"openWord("+w.id+")"}">
          <div class="dutch" style="color:${locked?"#444":wcolor}">${w.dutch}</div>
          <div class="english">${locked?"???":w.english}</div>
        </div>`;
      }).join("");
      groupsHTML+=`
        <div style="margin-bottom:1rem">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <span style="background:${color}22;color:${color};font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px">${TYPE_LABELS[type]}</span>
            <span style="font-size:12px;color:#555">${ws.length} words</span>
          </div>
          <div class="browse-grid">${cards}</div>
        </div>`;
    }

    html+=`<div class="browse-level-section">
      <div class="browse-level-header">
        <span class="browse-level-badge">Level ${lvl}</span>
        <span class="browse-level-title">${words.length} words</span>
        <span class="browse-level-lock">${unlocked?(lvl===currentLevel?guruPct+"% to next level":"✓ complete"):"🔒 locked"}</span>
      </div>
      ${groupsHTML}
    </div>`;
  }

  const typeCounts={noun:0,verb:0,adjective:0,adverb:0,other:0};
  VOCAB.forEach(w=>{ if(progress[w.id]?.lessonDone) typeCounts[detectType(w)]++; });
  const summaryHTML=Object.entries(typeCounts).map(([type,count])=>`
    <div style="text-align:center">

}

          style="flex:1;padding:8px 10px;font-size:13px;border-radius:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);outline:none;font-family:inherit;font-weight:500"
          onkeydown="if(event.key==='Enter'){addSynonym(${w.id},this.value);this.value='';selectedWord=VOCAB.find(x=>x.id===${w.id});render()}"/>
        <button onclick="addSynonym(${w.id},document.getElementById('syn-input').value);document.getElementById('syn-input').value='';selectedWord=VOCAB.find(x=>x.id===${w.id});render()"
          style="padding:8px 14px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600">Add</button>
      </div>
    </div>
    <button class="modal-close btn-secondary" onclick="closeModal();closeInfoPanel()">Close</button>
  </div></div>`;
}

function renderLesson(app){
  const word=lessonQueue[lessonIdx];
  if(lessonPhase==="learn"){
    // auto-play Dutch word
    if(settings.autoPlay) setTimeout(()=>speak(word.dutch),200);
    // start fetching info
    if(!infoPanelCache[word.id]) fetchWordInfo(word);
    const cached=infoPanelCache[word.id];
    const langColors={"Germanic":"#2563eb","French":"#e85d9b","Latin":"#f59e0b","English":"#16a34a","Greek":"#8b5cf6","Arabic":"#06b6d4","Spanish":"#f97316","Dutch":"#2563eb","Unknown":"#6b7280"};
    const lang=cached?.etymology||null;
    const langColor=lang?langColors[lang]||"#6b7280":"#6b7280";

    app.innerHTML=`<div class="session-wrap">
      <div class="session-header">
        <button class="btn-back" onclick="screen='dashboard';render()">← back</button>
        <span style="font-size:13px;color:var(--muted);font-weight:500">${lessonIdx+1} / ${lessonQueue.length}</span>
      </div>
      <div class="session-progress"><div class="session-progress-fill" style="width:${Math.round(lessonIdx/lessonQueue.length*100)}%"></div></div>
      <div style="text-align:center">
        <div class="direction-label">Lesson — Learn</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:1rem 0 .25rem">
          <div class="big-word" style="margin:0">${word.dutch}</div>
          ${speakBtn(word.dutch)}
        </div>
        ${word.article?`<div style="color:var(--muted);font-size:14px;margin-bottom:4px;font-weight:500">${word.article} ${word.dutch}</div>`:""}
        <div style="font-size:22px;color:#9ca3af;margin:.75rem 0;font-weight:600">${word.english}</div>
        ${lang?`<div style="margin-bottom:1rem"><span style="background:${langColor}22;color:${langColor};font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px">${lang}</span></div>`:`<div style="margin-bottom:1rem;font-size:11px;color:var(--muted)">loading origin…</div>`}
      </div>

      <div style="margin-bottom:1.25rem">
        ${cached?.meaning?`
        <div class="card" style="margin-bottom:.6rem;text-align:left">
          <div class="card-label">Meaning</div>
          <div style="font-size:13px;line-height:1.65;color:#c4c4d8">${cached.meaning}</div>
        </div>`:` 
        <div class="card" style="margin-bottom:.6rem;color:var(--muted);font-size:13px">
          <span class="loading-dots">Loading meaning</span>
        </div>`}

        ${cached?.context?`
        <div class="card" style="text-align:left">
          <div class="card-label" style="display:flex;align-items:center;justify-content:space-between">
            <span>Examples</span>
            ${speakBtn(cached.context.replace(/<[^>]+>/g,"").split("\n")[0]||word.dutch,"nl-NL","13px")}
          </div>
          <div style="font-size:13px;line-height:1.75;color:#c4c4d8">${cached.context}</div>
        </div>`:`
        <div class="card" style="color:var(--muted);font-size:13px">
          <span class="loading-dots">Loading examples</span>
        </div>`}
      </div>

      <button id="next-btn" class="check-btn" style="background:#7c3aed" onclick="advanceLesson()">Got it →</button>
    </div>`;
    setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
    return;
  }
  const isMeaning=lessonPhase==="quiz-meaning";
  const prompt=isMeaning?word.dutch:word.english;
  const placeholder=isMeaning?"Type English meaning…":"Type Dutch word…";
  const dirLabel=isMeaning?"🇳🇱 Dutch → English":"🇬🇧 English → Dutch";
  const phaseNum=isMeaning?"1":"2";
  const nextLabel=lessonIdx+1<lessonQueue.length||!isMeaning?"Next →":"Finish lessons";
  const btnColor=feedback?(feedback.correct?"#16a34a":"#dc2626"):"#8a5cf6";
  app.innerHTML=`<div class="session-wrap">
    <div class="session-header">
      <button class="btn-back" onclick="screen='dashboard';render()">← back</button>
      <span style="font-size:13px;color:var(--muted);font-weight:500">${lessonIdx+1} / ${lessonQueue.length} · Quiz ${phaseNum}/2</span>
    </div>
    <div class="session-progress"><div class="session-progress-fill" style="width:${Math.round(lessonIdx/lessonQueue.length*100)}%"></div></div>
    <div style="text-align:center">
      <div class="direction-label">${dirLabel}</div>
      <div class="big-word">${prompt}</div>
      <div class="prompt-label">${isMeaning?"What is the English meaning?":"How do you write this in Dutch?"}</div>
      <input id="answer-input" type="text" class="${feedback?(feedback.correct?"correct":"wrong"):""}" value="${input.replace(/"/g,'&quot;')}" placeholder="${placeholder}" ${feedback?"disabled":""}/>
      ${feedback?`<div class="feedback ${feedback.correct?"correct":"wrong"}">${feedback.correct?(feedback.closeEnough?"~ Close enough!":"✓ Correct!"):"✗ Wrong — correct answer: "+feedback.answer}</div>${closeEnoughBtn(lessonPhase==="quiz-meaning"?"meaning":"dutch")}`:""}
      <button id="next-btn" class="check-btn" style="background:${btnColor}" onclick="submitLesson()">${feedback?nextLabel:"Check →"}</button>
      ${infoBtnHTML(word.id)}
    </div>
  </div>`;
  if(!feedback){
    const inp=document.getElementById("answer-input");
    inp.focus();
    inp.addEventListener("input",e=>input=e.target.value);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submitLesson(); }});
    if(infoPanelOpen) closeInfoPanel();
  } else {
    setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
  }
}

function renderReview(app){
  const{word,type}=reviewQueue[reviewIdx];
  const prompt=type==="meaning"?word.dutch:word.english;
  const label=type==="meaning"?"What is the English meaning?":"How do you write this in Dutch?";
  const sc=STAGE_COLORS[SRS_STAGES[progress[word.id].stage]]||"#888";
  const btnColor=feedback?(feedback.correct?"#16a34a":"#dc2626"):"#2563eb";
  const nextLabel=reviewIdx+1<reviewQueue.length?"Next →":"Finish reviews";
  app.innerHTML=`<div class="session-wrap">
    <div class="session-header">
      <button class="btn-back" onclick="screen='dashboard';render()">← back</button>
      <span style="font-size:13px;color:var(--muted);font-weight:500">${reviewIdx+1} / ${reviewQueue.length}</span>
      <span class="stage-badge" style="background:${sc}22;color:${sc}">${SRS_STAGES[progress[word.id].stage]}</span>
    </div>
    <div class="session-progress"><div class="session-progress-fill" style="width:${Math.round(reviewIdx/reviewQueue.length*100)}%"></div></div>
    <div style="text-align:center">
      <div class="direction-label">${type==="meaning"?"🇳🇱 Dutch → English":"🇬🇧 English → Dutch"}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:.75rem 0 .25rem">
        <div class="big-word" style="margin:0">${prompt}</div>
        ${type==="meaning"?speakBtn(word.dutch):""}
      </div>
      <div class="prompt-label">${label}</div>
      <input id="answer-input" type="text" class="${feedback?(feedback.correct?"correct":"wrong"):""}" value="${input.replace(/"/g,'&quot;')}" placeholder="${type==="meaning"?"Type English meaning…":"Type Dutch word…"}" ${feedback?"disabled":""}/>
      ${feedback?`<div class="feedback ${feedback.correct?"correct":"wrong"}">${feedback.correct?(feedback.closeEnough?"~ Close enough!":"✓ Correct!"):"✗ Wrong — correct answer: "+feedback.answer}${!feedback.correct&&type==="dutch"&&word.article?`<br><small>Article: ${word.article}</small>`:""}</div>${closeEnoughBtn(type)}`:""}
      <button id="next-btn" class="check-btn" style="background:${btnColor}" onclick="submitReview()">${feedback?nextLabel:"Check →"}</button>
    </div>
    <div class="stats-bar">
      <span>✓ ${sessionCorrect}</span>
      <span>✗ ${sessionTotal-sessionCorrect}</span>
      <span>${sessionTotal>0?Math.round(sessionCorrect/sessionTotal*100):0}%</span>
    </div>
    ${infoBtnHTML(word.id)}
  </div>`;
  if(!feedback){
    const inp=document.getElementById("answer-input");
    inp.focus();
    inp.addEventListener("input",e=>input=e.target.value);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submitReview(); }});
    if(infoPanelOpen) closeInfoPanel();
  } else {
    setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
  }
}

// ── SETTINGS PAGE ─────────────────────────────────────────────────────────
function renderSettings(app){
  app.innerHTML=`${navHTML("settings")}
    <h2>Settings</h2><p class="sub">Customize your study experience</p>

    <div class="card">
      <div class="card-label">Daily lesson limit</div>
      <div style="display:flex;align-items:center;gap:12px">
        <input type="range" min="5" max="50" step="5" value="${settings.lessonsPerDay}"
          style="flex:1;accent-color:#8a5cf6"
          oninput="this.nextElementSibling.textContent=this.value;settings.lessonsPerDay=parseInt(this.value);saveSettings()"/>
        <span style="font-size:20px;font-weight:500;min-width:36px;text-align:right">${settings.lessonsPerDay}</span>
      </div>
      <p style="font-size:12px;color:#555;margin-top:8px">Words introduced per day. Lower = less overwhelm, higher = faster progress.</p>
    </div>

    <div class="card">
      <div class="card-label">Review order</div>
      ${[["shuffle","🔀 Shuffled (recommended)"],["level","📶 By level (lowest first)"],["stage","⬆️ By SRS stage (lowest first)"]].map(([val,label])=>`
        <label style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:0.5px solid #2a2a3a">
          <input type="radio" name="reviewOrder" value="${val}" ${settings.reviewOrder===val?"checked":""} accent-color="#8a5cf6"
            onchange="settings.reviewOrder='${val}';saveSettings()"/>
          <span style="font-size:14px">${label}</span>
        </label>`).join("")}
    </div>

    <div class="card">
      <div class="card-label">Appearance</div>
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0">
        <span style="font-size:14px">Light mode</span>
        <input type="checkbox" ${settings.lightMode?"checked":""} style="width:18px;height:18px;accent-color:#8a5cf6"
          onchange="settings.lightMode=this.checked;saveSettings();render()"/>
      </label>
    </div>

    <div class="card">
      <div class="card-label">Audio</div>
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-size:14px">Auto-play pronunciation</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Plays Dutch word automatically on lesson cards</div>
        </div>
        <input type="checkbox" ${settings.autoPlay?"checked":""} style="width:18px;height:18px;accent-color:#8a5cf6;flex-shrink:0;margin-left:12px"
          onchange="settings.autoPlay=this.checked;saveSettings()"/>
      </label>
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0 4px">
        <div>
          <div style="font-size:14px">Slow audio</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Speaks at 60% speed — good for learning pronunciation</div>
        </div>
        <input type="checkbox" ${settings.slowAudio?"checked":""} style="width:18px;height:18px;accent-color:#8a5cf6;flex-shrink:0;margin-left:12px"
          onchange="settings.slowAudio=this.checked;saveSettings()"/>
      </label>
    </div>

    <div class="card">
      <div class="card-label">Progress</div>
      <button class="btn-secondary" style="background:#1a1a2e;color:#f87171;border-color:#7f1d1d;margin-top:0"
        onclick="if(confirm('Reset ALL progress? This cannot be undone.')){localStorage.clear();progress={};currentLevel=1;initProgress();screen='dashboard';render()}">
        Reset all progress
      </button>
    </div>`;
}

// ── CLOSE ENOUGH (meaning only) ───────────────────────────────────────────
function markCloseEnough(){
  // treat as correct for session score but don't advance SRS stage
  feedback={correct:true,answer:feedback.answer,closeEnough:true};
  sessionCorrect++;
  render();
  setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
}

function closeEnoughBtn(type){
  // only show on meaning (English) answers, not Dutch input
  if(!feedback||feedback.correct||type!=="meaning") return "";
  return `<button onclick="markCloseEnough()" style="width:100%;margin-top:8px;background:#78350f44;color:#fbbf24;border:0.5px solid #78350f;border-radius:8px;padding:10px;font-size:14px">
    Close enough — I had a typo
  </button>`;
}


// ── INFO PANEL ─────────────────────────────────────────────────────────────
let infoPanelOpen = false;
let infoPanelTab = "meaning"; // meaning | context
let infoPanelWord = null;
let infoPanelCache = {}; // wordId -> {meaning, context}
let infoPanelLoading = false;

function toggleInfoPanel(word){
  if(infoPanelOpen && infoPanelWord?.id===word.id){
    infoPanelOpen=false;
  } else {
    infoPanelOpen=true;
    infoPanelWord=word;
    infoPanelTab="meaning";
    if(!infoPanelCache[word.id]) fetchWordInfo(word);
  }
  renderInfoPanel();
  const app=document.getElementById("app");
  if(screen==="review") renderReview(app);
  else if(screen==="lesson") renderLesson(app);
}

function closeInfoPanel(){
  infoPanelOpen=false;
  renderInfoPanel();
}

// ── WORD INFO (static, baked into words.json) ─────────────────────────────
function fetchWordInfo(word){
  // Data is already in the word object from words.json
  const langColors={"Germanic":"#2563eb","French":"#e85d9b","Latin":"#f59e0b","English":"#16a34a","Greek":"#8b5cf6","Arabic":"#06b6d4","Spanish":"#f97316","Dutch":"#2563eb","Other":"#6b7280"};
  const lang = word.etymology || "Germanic";
  infoPanelCache[word.id] = {
    etymology: lang,
    meaning: word.meaning || `<b>${word.dutch}</b> means "${word.english}".`,
    context: word.example_nl
      ? `<b>${word.example_nl}</b><br>${word.example_en}`
      : `No example available.`
  };
  infoPanelLoading = false;
  renderInfoPanel();
  if(selectedWord?.id===word.id || (screen==="lesson"&&lessonPhase==="learn"&&lessonQueue[lessonIdx]?.id===word.id)) render();
}


function infoBtnHTML(wordId){
  if(!feedback) return "";
  const open = infoPanelOpen && infoPanelWord?.id===wordId;
  return '<button class="info-toggle-btn'+(open?' panel-open':'')+'" onclick="toggleInfoPanel(VOCAB.find(w=>w.id==='+wordId+'))">'+(open?'👁 Hide word info':'👁 View word info')+'</button>';
}

function renderInfoPanel(){
  let el=document.getElementById("info-panel");
  if(!el){
    el=document.createElement("div");
    el.id="info-panel";
    el.className="info-panel";
    document.body.appendChild(el);
  }

  if(!infoPanelOpen){ el.classList.remove("open"); return; }
  el.classList.add("open");

  const w=infoPanelWord;
  const cached=infoPanelCache[w?.id];
  const stageC=w?stageColor(w):"#888";

  const tabBtn=(id,label)=>`<button class="info-panel-tab${infoPanelTab===id?" active":""}" onclick="infoPanelTab='${id}';renderInfoPanel()">${label}</button>`;

  const langColors={"Germanic":"#2563eb","French":"#e85d9b","Latin":"#f59e0b","English":"#16a34a","Greek":"#8b5cf6","Arabic":"#06b6d4","Spanish":"#f97316","Dutch":"#2563eb","Other":"#6b7280"};
  const lang=cached?.etymology||"Germanic";
  const langColor=langColors[lang]||"#6b7280";

  let body="";
  if(!cached){
    body=`<div class="info-content" style="color:var(--muted);padding:1rem 0">Loading…</div>`;
  } else if(infoPanelTab==="meaning"){
    body=`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <span style="font-size:26px;font-weight:800;color:${stageC};letter-spacing:-.02em">${w.dutch}</span>
        ${w.article?`<span style="font-size:13px;color:var(--muted);font-weight:500">${w.article}</span>`:""}
        <span style="background:${langColor}22;color:${langColor};font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-left:auto">${lang}</span>
      </div>
      <div class="info-content">${cached.meaning}</div>`;
  } else {
    body=`
      <div style="margin-bottom:10px;font-size:13px;font-weight:600;color:var(--muted)">Example sentence</div>
      <div class="info-content">${cached.context}</div>`;
  }

  const syns=w?getSynonyms(w.id):[];
  const synLine=syns.length?`<div style="margin-top:12px;font-size:12px;color:var(--muted)">Your synonyms: ${syns.map(s=>`<span style="background:#ffffff0f;border-radius:4px;padding:1px 6px">${s}</span>`).join(" ")}</div>`:"";

  el.innerHTML=`
    <div class="info-panel-tabs">
      ${tabBtn("meaning","✦ Meaning")}
      ${tabBtn("context","💬 Context")}
      <button class="info-panel-tab" onclick="closeInfoPanel()" style="flex:0;padding:13px 16px;font-size:18px;line-height:1">×</button>
    </div>
    <div class="info-panel-body">
      ${body}
      ${synLine}
    </div>`;
}


// ── LESSON PICKER ──────────────────────────────────────────────────────────
let pickerSelected = new Set();

function openLessonPicker(){
  pickerSelected = new Set();
  screen = "picker";
  render();
}

function togglePickerWord(id){
  if(pickerSelected.has(id)) pickerSelected.delete(id);
  else pickerSelected.add(id);
  render();
}

function selectAllPicker(){
  const unlearned = wordsForLevel(currentLevel).filter(w=>!progress[w.id]?.lessonDone);
  unlearned.forEach(w=>pickerSelected.add(w.id));
  render();
}

function startPickerLessons(){
  if(!pickerSelected.size) return;
  const words = VOCAB.filter(w=>pickerSelected.has(w.id));
  lessonQueue = words;
  lessonIdx=0; lessonPhase="learn"; input=""; feedback=null;
  sessionCorrect=0; sessionTotal=0; sessionDone=false; showLevelUp=false;
  sessionStartTime=Date.now();
  screen="lesson"; render();
}

function renderPicker(app){
  const unlearned = wordsForLevel(currentLevel).filter(w=>!progress[w.id]?.lessonDone);
  const learned   = wordsForLevel(currentLevel).filter(w=>progress[w.id]?.lessonDone);
  const sel = pickerSelected.size;

  const wordBtn = (w) => {
    const isSel = pickerSelected.has(w.id);
    return `<div class="picker-word${isSel?" selected":""}" onclick="togglePickerWord(${w.id})">${w.dutch}</div>`;
  };

  app.innerHTML=`${navHTML("dashboard")}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <button class="btn-back" onclick="screen='dashboard';render()">← back</button>
    </div>
    <h2 style="margin-bottom:3px">Lesson Picker</h2>
    <p class="sub">Select words to study, then start your custom batch.</p>

    ${unlearned.length ? `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="card-label" style="margin-bottom:0">Level ${currentLevel} — Not yet learned (${unlearned.length})</div>
        <button onclick="selectAllPicker()" style="background:none;border:none;color:var(--purple-bright);font-size:12px;font-weight:600;padding:0;cursor:pointer">Select all</button>
      </div>
      <div class="picker-grid">
        ${unlearned.map(wordBtn).join("")}
      </div>
    </div>` : `<div class="card"><p style="color:var(--muted);font-size:14px">All words in this level have been learned!</p></div>`}

    ${learned.length ? `
    <div class="card">
      <div class="card-label">Already learned (${learned.length})</div>
      <div class="picker-grid">
        ${learned.map(w=>`<div class="picker-word" style="opacity:.35;cursor:default">${w.dutch}</div>`).join("")}
      </div>
    </div>` : ""}

    <div style="position:sticky;bottom:1rem;padding-top:.5rem">
      <button class="btn-lesson" style="width:100%;${sel===0?"opacity:.35;cursor:not-allowed":""}"
        onclick="startPickerLessons()" ${sel===0?"disabled":""}>
        ${sel>0?`Start ${sel} word${sel>1?"s":""}`:"Select words above to start"}
      </button>
    </div>`;
}

async function init(){
  try{ const r=await fetch("words.json"); VOCAB=await r.json(); }catch(e){ VOCAB=[]; }
  load(); initProgress(); render();
}
init();
if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
</script>
</body>
</html>
