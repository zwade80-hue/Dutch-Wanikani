<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dutch Vocab</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#8a5cf6"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#0a0a1a;color:#f0f0f0;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:url('benelux.png') no-repeat center 5%;
      background-size:55% auto;opacity:0.08}
    #app{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:1.5rem}

    nav{display:flex;gap:8px;margin-bottom:1.5rem;border-bottom:0.5px solid #2a2a2a;padding-bottom:1rem}
    nav button{background:none;border:none;color:#888;font-size:14px;cursor:pointer;padding:6px 12px;border-radius:6px}
    nav button.active{background:#1a1a2e;color:#f0f0f0}

    h2{font-size:22px;font-weight:500;margin-bottom:4px}
    p.sub{color:#888;font-size:14px;margin-bottom:1.5rem}
    button{cursor:pointer;font-family:inherit;font-size:15px;border-radius:8px;border:0.5px solid #333;padding:12px;transition:opacity .15s}
    button:disabled{opacity:0.4;cursor:not-allowed}

    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
    .metric{background:#0f0f1fee;border:0.5px solid #2a2a4a;border-radius:8px;padding:12px 1rem}
    .metric .label{font-size:13px;color:#888;margin-bottom:4px}
    .metric .value{font-size:26px;font-weight:500}

    .btn-row{display:flex;gap:12px;margin-bottom:1.5rem}
    .btn-review{flex:1;background:#2563eb;color:#fff;border-color:#2563eb}
    .btn-lesson{flex:1;background:#8a5cf6;color:#fff;border-color:#8a5cf6}
    .btn-secondary{background:#1a1a2e;color:#f0f0f0;width:100%;margin-top:12px}
    .btn-back{background:none;border:none;color:#888;font-size:14px;padding:0}

    .card{background:#0f0f1fee;border:0.5px solid #2a2a4a;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
    .card-label{font-size:13px;font-weight:500;color:#888;margin-bottom:10px}

    .level-bar-wrap{background:#0f0f1fee;border:0.5px solid #2a2a4a;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
    .level-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .level-title{font-size:16px;font-weight:500}
    .level-pct{font-size:13px;color:#888}
    .level-bar{height:8px;background:#2a2a3a;border-radius:4px;overflow:hidden}
    .level-bar-fill{height:100%;background:#8a5cf6;border-radius:4px}

    .stage-pills{display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:flex;align-items:center;gap:6px;background:#1a1a2e;border-radius:6px;padding:6px 10px;font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

    .session-wrap{max-width:560px;margin:0 auto;padding:0 1rem}
    .session-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
    .stage-badge{font-size:12px;padding:3px 8px;border-radius:12px;font-weight:500}
    .direction-label{font-size:13px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center}
    .big-word{font-size:52px;font-weight:500;margin:1rem 0 0.5rem;text-align:center}
    .prompt-label{font-size:14px;color:#666;margin-bottom:1.5rem;text-align:center}

    #answer-input{width:100%;padding:12px;font-size:18px;border-radius:8px;background:#1a1a2e;color:#f0f0f0;outline:none;font-family:inherit;border:2px solid #333}
    #answer-input.correct{border-color:#16a34a}
    #answer-input.wrong{border-color:#dc2626}

    .feedback{margin:1rem 0;padding:12px;border-radius:8px;font-size:15px;text-align:center}
    .feedback.correct{background:#14532d44;color:#4ade80}
    .feedback.wrong{background:#7f1d1d44;color:#f87171}

    .check-btn{width:100%;margin-top:12px;color:#fff;border:none;font-size:16px;padding:14px;border-radius:8px}

    .stats-bar{background:#0f0f1fee;border-radius:8px;padding:10px 12px;margin-top:1.5rem;display:flex;gap:16px;font-size:13px;color:#888}
    .stats-bar span:last-child{margin-left:auto}

    .done-screen{text-align:center;padding:3rem 1.5rem}
    .done-screen .emoji{font-size:48px;margin-bottom:1rem}

    .levelup-screen{text-align:center;padding:3rem 1.5rem}
    .levelup-num{font-size:80px;font-weight:700;color:#8a5cf6;line-height:1;margin:1rem 0}

    .browse-level-section{margin-bottom:2rem}
    .browse-level-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .browse-level-badge{background:#8a5cf6;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px}
    .browse-level-title{font-size:16px;font-weight:500}
    .browse-level-lock{font-size:13px;color:#555;margin-left:auto}
    .browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
    .browse-card{border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;border:0.5px solid transparent;transition:transform .1s}
    .browse-card:hover{transform:scale(1.04)}
    .browse-card .dutch{font-size:16px;font-weight:500;margin-bottom:2px}
    .browse-card .english{font-size:11px;opacity:.7}
    .browse-card.locked{background:#1a1a1a;border-color:#2a2a2a;opacity:.4;cursor:default}
    .browse-card.locked:hover{transform:none}

    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
    .modal{background:#1a1a2e;border-radius:16px;padding:2rem;max-width:420px;width:100%;border:0.5px solid #333}
    .modal-word{font-size:48px;font-weight:500;text-align:center;margin-bottom:4px}
    .modal-article{font-size:16px;color:#888;text-align:center;margin-bottom:8px}
    .modal-english{font-size:22px;color:#aaa;text-align:center;margin-bottom:1.5rem}
    .modal-row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:0.5px solid #2a2a2a}
    .modal-row:last-child{border-bottom:none}
    .modal-close{width:100%;margin-top:1.5rem;background:#222;color:#f0f0f0;border:0.5px solid #333}
  </style>
</head>
<body>
<div id="app"><p style="text-align:center;padding:3rem;color:#888">Loading...</p></div>
<script>
const SRS_STAGES   = ["Apprentice 1","Apprentice 2","Apprentice 3","Apprentice 4","Guru 1","Guru 2","Master","Enlightened","Burned"];
const SRS_INTERVALS= [4,8,24,72,168,336,730,2160,Infinity];
const STAGE_COLORS = {"Apprentice 1":"#e85d9b","Apprentice 2":"#e85d9b","Apprentice 3":"#e85d9b","Apprentice 4":"#e85d9b","Guru 1":"#8a5cf6","Guru 2":"#8a5cf6","Master":"#2563eb","Enlightened":"#0ea5e9","Burned":"#16a34a"};
const WORDS_PER_LEVEL = 83;
const LESSONS_PER_DAY = 15;
const GURU_THRESHOLD  = 0.9;
const HOUR_MS = 3600000;

let VOCAB=[], progress={}, currentLevel=1;
let screen="dashboard", selectedWord=null;
let reviewQueue=[], reviewIdx=0;
let lessonQueue=[], lessonIdx=0, lessonPhase="learn";
let input="", feedback=null;
let sessionCorrect=0, sessionTotal=0, sessionDone=false, showLevelUp=false;
let sessionStartTime=null;

function save(){
  localStorage.setItem("dutch-progress",JSON.stringify(progress));
  localStorage.setItem("dutch-level",currentLevel);
}
function load(){
  const p=localStorage.getItem("dutch-progress"); if(p) progress=JSON.parse(p);
  currentLevel=parseInt(localStorage.getItem("dutch-level")||"1");
}

// ── WORD TYPE DETECTION ────────────────────────────────────────────────────
const KNOWN_ADJECTIVES = new Set([
  "good","bad","big","small","red","blue","new","old","hot","cold","fast","slow",
  "happy","sad","angry","tired","sick","healthy","clean","dirty","empty","full",
  "heavy","light","dark","bright","loud","quiet","hard","soft","warm","cool",
  "easy","difficult","important","famous","free","busy","rich","poor","safe",
  "dangerous","beautiful","ugly","tall","short","long","wide","narrow","deep",
  "shallow","thick","thin","sharp","flat","round","straight","wrong","right",
  "true","false","real","fake","late","early","near","far","open","closed",
  "young","strong","weak","fresh","frozen","raw","cooked","sweet","sour","salty",
  "spicy","creamy","tasty","boring","funny","scary","strange","normal","special",
  "different","same","next","last","first","second","certain","possible","necessary",
  "available","reliable","mutual","daily","nervous","lonely","calm","patient",
  "honest","friendly","adventurous","notorious","indifferent","impressive",
  "valuable","intense","unique","pleasant","notorious","savory","tender",
  "slippery","creamy","sunny","cozy","relieved","satisfied","ready","finished",
  "greasy","expensive","cheap","lucky","careful","careless","efficient","accurate"
]);
const KNOWN_ADVERBS = new Set([
  "always","never","often","sometimes","usually","mostly","already","still",
  "just","also","too","very","really","quite","rather","almost","nearly",
  "soon","now","today","yesterday","tomorrow","here","there","together",
  "immediately","suddenly","slowly","quickly","carefully","clearly","loudly",
  "quietly","fluently","efficiently","accurately","recently","lately","early",
  "later","finally","eventually","probably","certainly","perhaps","maybe",
  "especially","actually","honestly","basically","generally","normally",
  "approximately","at least","by the way","indeed","nevertheless","otherwise",
  "therefore","however","although","enough","hardly","merely","only","even",
  "else","instead","rather","mostly","mostly","overall","instead"
]);
const KNOWN_CONJUNCTIONS = new Set([
  "and","but","or","because","although","while","when","if","that","so",
  "however","therefore","nevertheless","otherwise","whether","until","before",
  "after","since","unless","except","despite","during","without","between",
  "among","each other","by the way"
]);
const KNOWN_PRONOUNS = new Set([
  "someone","everyone","nobody","anyone","something","everything","nothing",
  "each other","how much / how many"
]);

function detectType(word) {
  const eng = word.english.toLowerCase().trim();
  // verb
  if(eng.startsWith("to ")) return "verb";
  // multiple meanings — check first
  const first = eng.split("/")[0].trim();
  if(first.startsWith("to ")) return "verb";
  // adverb
  if(KNOWN_ADVERBS.has(eng)||KNOWN_ADVERBS.has(first)) return "adverb";
  // conjunction/particle
  if(KNOWN_CONJUNCTIONS.has(eng)||KNOWN_CONJUNCTIONS.has(first)) return "other";
  // pronoun
  if(KNOWN_PRONOUNS.has(eng)||KNOWN_PRONOUNS.has(first)) return "other";
  // adjective
  if(KNOWN_ADJECTIVES.has(eng)||KNOWN_ADJECTIVES.has(first)) return "adjective";
  // ends in -ly usually adverb
  if(eng.endsWith("ly")||first.endsWith("ly")) return "adverb";
  // default noun
  return "noun";
}

const TYPE_COLORS = { noun:"#2563eb", verb:"#e85d9b", adjective:"#f59e0b", adverb:"#16a34a", other:"#888" };
const TYPE_LABELS = { noun:"Noun", verb:"Verb", adjective:"Adjective", adverb:"Adverb", other:"Other" };
function getStreak(){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-streak-date");
  const count=parseInt(localStorage.getItem("dutch-streak")||"0");
  if(last===today) return count;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  if(last===yesterday) return count;
  return 0;
}
function updateStreak(){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-streak-date");
  const count=parseInt(localStorage.getItem("dutch-streak")||"0");
  if(last===today) return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  const newCount=last===yesterday?count+1:1;
  localStorage.setItem("dutch-streak",newCount);
  localStorage.setItem("dutch-streak-date",today);
}

// ── TIME STUDIED ───────────────────────────────────────────────────────────
function addStudyTime(ms){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-time-date");
  const total=last===today?parseInt(localStorage.getItem("dutch-time-today")||"0"):0;
  localStorage.setItem("dutch-time-date",today);
  localStorage.setItem("dutch-time-today",total+ms);
  const allTime=parseInt(localStorage.getItem("dutch-time-all")||"0");
  localStorage.setItem("dutch-time-all",allTime+ms);
}
function formatTime(ms){
  const m=Math.floor(ms/60000), h=Math.floor(m/60);
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}m`;
}

// ── ACCURACY PER WORD ──────────────────────────────────────────────────────
function recordAccuracy(wordId, correct){
  const key=`dutch-acc-${wordId}`;
  const data=JSON.parse(localStorage.getItem(key)||'{"c":0,"t":0}');
  data.t++; if(correct) data.c++;
  localStorage.setItem(key,JSON.stringify(data));
}
function getAccuracy(wordId){
  const data=JSON.parse(localStorage.getItem(`dutch-acc-${wordId}`)||'{"c":0,"t":0}');
  return data.t===0?null:Math.round(data.c/data.t*100);
}

// ── UPCOMING REVIEWS ───────────────────────────────────────────────────────
function getUpcomingReviews(){
  const now=Date.now();
  const hours=[];
  for(let i=0;i<24;i++) hours.push(0);
  VOCAB.forEach(w=>{
    const p=progress[w.id];
    if(!p?.lessonDone||p.nextReview<=now) return;
    const hoursFromNow=Math.floor((p.nextReview-now)/HOUR_MS);
    if(hoursFromNow<24) hours[hoursFromNow]++;
  });
  return hours;
}
function getDailyForecast(){
  const now=Date.now();
  const days=[];
  for(let d=0;d<7;d++){
    const start=now+d*86400000;
    const end=start+86400000;
    let count=0;
    VOCAB.forEach(w=>{
      const p=progress[w.id];
      if(!p?.lessonDone) return;
      if(p.nextReview>now&&p.nextReview>=start&&p.nextReview<end) count++;
    });
    const date=new Date(start);
    const label=d===0?"Today":d===1?"Tomorrow":date.toLocaleDateString("en-US",{weekday:"short"});
    days.push({label,count});
  }
  // running total
  let running=dueReviews().length;
  days.forEach(d=>{ running+=d.count; d.total=running; });
  return days;
}
function initProgress(){
  VOCAB.forEach(w=>{if(!progress[w.id]) progress[w.id]={stage:0,nextReview:Date.now(),lessonDone:false};});
}
function wordsForLevel(lvl){ return VOCAB.slice((lvl-1)*WORDS_PER_LEVEL, lvl*WORDS_PER_LEVEL); }
function guruCount(lvl){ return wordsForLevel(lvl).filter(w=>progress[w.id]?.lessonDone&&progress[w.id]?.stage>=4).length; }
function levelProgress(lvl){ const w=wordsForLevel(lvl); return w.length?guruCount(lvl)/w.length:0; }
function checkLevelUp(){
  if(levelProgress(currentLevel)>=GURU_THRESHOLD&&currentLevel<60&&wordsForLevel(currentLevel+1).length>0){
    currentLevel++; save(); return true;
  }
  return false;
}
function lessonsToday(){
  const today=new Date().toDateString();
  const last=localStorage.getItem("dutch-lastday");
  return last===today?parseInt(localStorage.getItem("dutch-lessonstoday")||"0"):0;
}
function availableLessons(){
  const rem=LESSONS_PER_DAY-lessonsToday();
  if(rem<=0) return [];
  return wordsForLevel(currentLevel).filter(w=>!progress[w.id]?.lessonDone).slice(0,rem);
}
function dueReviews(){ return VOCAB.filter(w=>progress[w.id]?.lessonDone&&progress[w.id]?.nextReview<=Date.now()); }
function normalize(s){ return s.trim().toLowerCase().replace(/[^a-z ]/g,""); }
function similar(a,b){
  a=normalize(a); b=normalize(b);
  if(a===b) return true;
  if(b.split("/").map(x=>x.trim()).some(x=>a===x)) return true;
  if(Math.abs(a.length-b.length)>2) return false;
  let d=0; for(let i=0;i<Math.max(a.length,b.length);i++) if(a[i]!==b[i]) d++;
  return d<=1;
}
function stageColor(w){ const p=progress[w.id]; if(!p?.lessonDone) return "#333"; return STAGE_COLORS[SRS_STAGES[p.stage]]||"#888"; }
function stageCounts(){ const c={}; SRS_STAGES.forEach(s=>c[s]=0); VOCAB.forEach(w=>{if(progress[w.id]?.lessonDone)c[SRS_STAGES[progress[w.id].stage]]++;}); return c; }

function startLessons(){
  lessonQueue=availableLessons(); if(!lessonQueue.length) return;
  lessonIdx=0; lessonPhase="learn"; input=""; feedback=null;
  sessionCorrect=0; sessionTotal=0; sessionDone=false; showLevelUp=false;
  sessionStartTime=Date.now();
  screen="lesson"; render();
}
function startReviews(){
  const due=dueReviews(); if(!due.length) return;
  reviewQueue=[];
  due.forEach(w=>{reviewQueue.push({word:w,type:"meaning"});reviewQueue.push({word:w,type:"dutch"});});
  for(let i=reviewQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[reviewQueue[i],reviewQueue[j]]=[reviewQueue[j],reviewQueue[i]];}
  reviewIdx=0; input=""; feedback=null;
  sessionCorrect=0; sessionTotal=0; sessionDone=false; showLevelUp=false;
  sessionStartTime=Date.now();
  screen="review"; render();
}

function checkAnswer(expected){
  const correct=similar(input,expected);
  feedback={correct,answer:expected};
  sessionTotal++; if(correct) sessionCorrect++;
  render();
  // after render, focus the next button so Enter advances
  setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
}

function advanceReview(){
  feedback=null; input="";
  if(reviewIdx+1<reviewQueue.length){ reviewIdx++; render(); setTimeout(()=>document.getElementById("answer-input")?.focus(),50); }
  else{ const leveled=checkLevelUp(); save(); sessionDone=true; showLevelUp=leveled; render(); }
}
function submitReview(){
  if(feedback){ advanceReview(); return; }
  const{word,type}=reviewQueue[reviewIdx];
  const expected=type==="meaning"?word.english:word.dutch;
  const cur=progress[word.id];
  const correct=similar(input,expected);
  const newStage=correct?Math.min(cur.stage+1,SRS_STAGES.length-1):Math.max(cur.stage-1,0);
  progress[word.id]={...cur,stage:newStage,nextReview:Date.now()+SRS_INTERVALS[newStage]*3600000};
  recordAccuracy(word.id,correct);
  save();
  checkAnswer(expected);
}

function advanceLesson(){
  feedback=null; input="";
  if(lessonPhase==="learn"){ lessonPhase="quiz-meaning"; render(); setTimeout(()=>document.getElementById("answer-input")?.focus(),50); return; }
  if(lessonPhase==="quiz-meaning"){ lessonPhase="quiz-dutch"; render(); setTimeout(()=>document.getElementById("answer-input")?.focus(),50); return; }
  if(lessonIdx+1<lessonQueue.length){ lessonIdx++; lessonPhase="learn"; render(); }
  else{
    lessonQueue.forEach(w=>{progress[w.id]={...progress[w.id],lessonDone:true,stage:0,nextReview:Date.now()+SRS_INTERVALS[0]*3600000};});
    const today=new Date().toDateString();
    const given=lessonsToday();
    localStorage.setItem("dutch-lastday",today);
    localStorage.setItem("dutch-lessonstoday",given+lessonQueue.length);
    finishSession(); const leveled=checkLevelUp(); save(); sessionDone=true; showLevelUp=leveled; render();
  }
}
function submitLesson(){
  if(feedback){ advanceLesson(); return; }
  const word=lessonQueue[lessonIdx];
  const expected=lessonPhase==="quiz-meaning"?word.english:word.dutch;
  if(!similar(input,expected)){
    checkAnswer(expected);
  } else {
    checkAnswer(expected);
  }
}

function navHTML(active){
  return `<nav>
    <button class="${active==="dashboard"?"active":""}" onclick="screen='dashboard';selectedWord=null;render()">Dashboard</button>
    <button class="${active==="browse"?"active":""}" onclick="screen='browse';render()">Browse</button>
  </nav>`;
}

function render(){
  const app=document.getElementById("app");

  if(showLevelUp){
    app.innerHTML=`<div class="levelup-screen">
      <div style="font-size:64px">🎉</div>
      <p style="color:#888;margin-top:1rem">Level up!</p>
      <div class="levelup-num">${currentLevel}</div>
      <p style="color:#888;margin-bottom:2rem">Level ${currentLevel} unlocked!</p>
      <button class="btn-secondary" style="max-width:200px;margin:0 auto" onclick="showLevelUp=false;screen='dashboard';render()">Continue</button>
    </div>`; return;
  }

  if(sessionDone){
    app.innerHTML=`<div class="done-screen">
      <div class="emoji">🎉</div>
      <h2>${screen==="lesson"?"Lessons complete!":"Reviews complete!"}</h2>
      <p style="color:#888;margin:.5rem 0 1.5rem">${sessionCorrect}/${sessionTotal} correct (${sessionTotal>0?Math.round(sessionCorrect/sessionTotal*100):0}%)</p>
      <button class="btn-secondary" onclick="screen='dashboard';sessionDone=false;render()">Back to dashboard</button>
    </div>`; return;
  }

  if(screen==="dashboard") renderDashboard(app);
  else if(screen==="browse") renderBrowse(app);
  else if(screen==="lesson") renderLesson(app);
  else if(screen==="review") renderReview(app);
}

function renderDashboard(app){
  const due=dueReviews().length, lessons=availableLessons().length;
  const sc=stageCounts(), burned=sc["Burned"]||0;
  const pct=Math.round(levelProgress(currentLevel)*100);
  const gurus=guruCount(currentLevel), total=wordsForLevel(currentLevel).length;
  const needed=Math.ceil(total*GURU_THRESHOLD);
  const streak=getStreak();
  const todayMs=parseInt(localStorage.getItem("dutch-time-date")===new Date().toDateString()?localStorage.getItem("dutch-time-today")||"0":"0");
  const allMs=parseInt(localStorage.getItem("dutch-time-all")||"0");

  // accuracy across all words
  let totalC=0,totalT=0;
  VOCAB.forEach(w=>{ const d=JSON.parse(localStorage.getItem(`dutch-acc-${w.id}`)||'{"c":0,"t":0}'); totalC+=d.c; totalT+=d.t; });
  const overallAcc=totalT>0?Math.round(totalC/totalT*100):null;

  const pillsHTML=["Apprentice","Guru","Master","Enlightened","Burned"].map(g=>{
    const count=Object.entries(sc).filter(([k])=>k.startsWith(g)).reduce((a,[,v])=>a+v,0);
    const color=STAGE_COLORS[g+" 1"]||STAGE_COLORS[g];
    return `<div class="pill"><span class="dot" style="background:${color}"></span><span style="color:#aaa">${g}</span><span style="font-weight:500">${count}</span></div>`;
  }).join("");

  // forecast chart
  const upcoming=getUpcomingReviews();
  const forecast=getDailyForecast();
  const next24=upcoming.reduce((a,b)=>a+b,0);
  const maxBar=Math.max(...upcoming,1);
  const maxDay=Math.max(...forecast.map(d=>d.count),1);
  const now=new Date();

  const chartBars=upcoming.map((count,i)=>{
    const h=(now.getHours()+i)%24;
    const ampm=h>=12?"pm":"am";
    const label=h===0?"12am":h===12?"12pm":h>12?`${h-12}${ampm}`:`${h}${ampm}`;
    const height=count>0?Math.max(Math.round(count/maxBar*60),4):0;
    const isNow=i===0;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0">
      ${count>0?`<span style="font-size:10px;color:#888">${count}</span>`:`<span style="font-size:10px;color:transparent">0</span>`}
      <div style="width:100%;height:${height}px;background:${isNow?"#2563eb":"#8a5cf6"};border-radius:3px 3px 0 0;min-height:${count>0?4:0}px"></div>
      <span style="font-size:9px;color:#555;white-space:nowrap">${label}</span>
    </div>`;
  }).join("");

  const forecastRows=forecast.map((d,i)=>{
    const barW=d.count>0?Math.max(Math.round(d.count/maxDay*100),8):0;
    return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:0.5px solid #1a1a2e">
      <span style="font-size:13px;color:#888;width:52px;flex-shrink:0">${d.label}</span>
      <div style="flex:1;background:#1a1a2e;border-radius:3px;height:18px;overflow:hidden">
        <div style="width:${barW}%;height:100%;background:#16a34a;border-radius:3px"></div>
      </div>
      <span style="font-size:12px;color:#16a34a;width:36px;text-align:right;flex-shrink:0">+${d.count}</span>
      <span style="font-size:12px;color:#888;width:32px;text-align:right;flex-shrink:0">${d.total}</span>
    </div>`;
  }).join("");

  app.innerHTML=`${navHTML("dashboard")}
    <h2>🇳🇱 Dutch Vocab</h2><p class="sub">Spaced repetition system</p>

    <div class="level-bar-wrap">
      <div class="level-header"><span class="level-title">Level ${currentLevel}</span><span class="level-pct">${gurus}/${needed} Guru to level up</span></div>
      <div class="level-bar"><div class="level-bar-fill" style="width:${Math.min(pct,100)}%"></div></div>
    </div>

    <div class="grid-3">
      <div class="metric"><div class="label">Reviews due</div><div class="value" style="color:#2563eb">${due}</div></div>
      <div class="metric"><div class="label">Lessons today</div><div class="value" style="color:#8a5cf6">${lessons}</div></div>
      <div class="metric"><div class="label">Words burned</div><div class="value" style="color:#16a34a">${burned}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem">
      <div class="metric"><div class="label">🔥 Streak</div><div class="value" style="color:#f59e0b">${streak}<span style="font-size:14px;color:#888"> days</span></div></div>
      <div class="metric"><div class="label">🎯 Accuracy</div><div class="value" style="color:#e85d9b">${overallAcc!==null?overallAcc+"%":"—"}</div></div>
      <div class="metric"><div class="label">⏱ Today</div><div class="value" style="color:#0ea5e9;font-size:20px">${todayMs>0?formatTime(todayMs):"—"}</div></div>
    </div>

    <div class="btn-row">
      <button class="btn-review" onclick="startReviews()" ${due===0?"disabled":""}>Start reviews (${due})</button>
      <button class="btn-lesson" onclick="startLessons()" ${lessons===0?"disabled":""}>Start lessons (${lessons})</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem">
      <div class="card" style="margin-bottom:0">
        <div class="card-label">Next 24 hours · ${next24} items</div>
        <div style="display:flex;align-items:flex-end;gap:2px;height:80px;padding-top:16px">
          ${chartBars}
        </div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="card-label">7-day forecast</div>
        <div style="margin-top:4px">${forecastRows}</div>
      </div>
    </div>

    <div class="card"><div class="card-label">SRS progress</div><div class="stage-pills">${pillsHTML}</div></div>`;
}

function renderBrowse(app){
  const maxLevel=Math.ceil(VOCAB.length/WORDS_PER_LEVEL);
  let html="";
  for(let lvl=1;lvl<=maxLevel;lvl++){
    const words=wordsForLevel(lvl), unlocked=lvl<=currentLevel;
    const guruPct=Math.round(levelProgress(lvl)*100);

    // group by type
    const groups={noun:[],verb:[],adjective:[],adverb:[],other:[]};
    words.forEach(w=>groups[detectType(w)].push(w));

    let groupsHTML="";
    for(const [type,ws] of Object.entries(groups)){
      if(!ws.length) continue;
      const color=TYPE_COLORS[type];
      const cards=ws.map(w=>{
        const wcolor=stageColor(w), locked=!unlocked;
        return `<div class="browse-card${locked?" locked":""}" style="${locked?"":"background:"+wcolor+"22;border-color:"+wcolor+"44"}" onclick="${locked?"":"openWord("+w.id+")"}">
          <div class="dutch" style="color:${locked?"#444":wcolor}">${w.dutch}</div>
          <div class="english">${locked?"???":w.english}</div>
        </div>`;
      }).join("");
      groupsHTML+=`
        <div style="margin-bottom:1rem">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <span style="background:${color}22;color:${color};font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px">${TYPE_LABELS[type]}</span>
            <span style="font-size:12px;color:#555">${ws.length} words</span>
          </div>
          <div class="browse-grid">${cards}</div>
        </div>`;
    }

    html+=`<div class="browse-level-section">
      <div class="browse-level-header">
        <span class="browse-level-badge">Level ${lvl}</span>
        <span class="browse-level-title">${words.length} words</span>
        <span class="browse-level-lock">${unlocked?(lvl===currentLevel?guruPct+"% to next level":"✓ complete"):"🔒 locked"}</span>
      </div>
      ${groupsHTML}
    </div>`;
  }

  // type summary bar at top
  const typeCounts={noun:0,verb:0,adjective:0,adverb:0,other:0};
  VOCAB.forEach(w=>{ if(progress[w.id]?.lessonDone) typeCounts[detectType(w)]++; });
  const summaryHTML=Object.entries(typeCounts).map(([type,count])=>`
    <div style="text-align:center">
      <div style="font-size:11px;color:${TYPE_COLORS[type]};font-weight:600;margin-bottom:2px">${TYPE_LABELS[type]}</div>
      <div style="font-size:18px;font-weight:500">${count}</div>
    </div>`).join("");

  app.innerHTML=`${navHTML("browse")}
    <h2 style="margin-bottom:1rem">All words</h2>
    <div style="display:flex;justify-content:space-around;background:#0f0f1fee;border:0.5px solid #2a2a4a;border-radius:12px;padding:1rem;margin-bottom:1.5rem">
      ${summaryHTML}
    </div>
    ${html}
    ${selectedWord?renderModal():""}`;
}

function openWord(id){ selectedWord=VOCAB.find(w=>w.id===id); render(); }
function closeModal(){ selectedWord=null; render(); }
function renderModal(){
  const w=selectedWord, p=progress[w.id];
  const stage=p?.lessonDone?SRS_STAGES[p.stage]:"Not started";
  const color=stageColor(w);
  const next=p?.lessonDone&&p.nextReview>Date.now()?new Date(p.nextReview).toLocaleDateString():p?.lessonDone?"Due now":"—";
  const acc=getAccuracy(w.id);
  const type=detectType(w);
  const typeColor=TYPE_COLORS[type];
  return `<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
    <div style="text-align:center;margin-bottom:8px">
      <span style="background:${typeColor}22;color:${typeColor};font-size:11px;font-weight:600;padding:3px 10px;border-radius:4px">${TYPE_LABELS[type]}</span>
    </div>
    <div class="modal-word" style="color:${color}">${w.dutch}</div>
    ${w.article?`<div class="modal-article">${w.article} ${w.dutch}</div>`:""}
    <div class="modal-english">${w.english}</div>
    <div class="modal-row"><span style="color:#888">SRS stage</span><span style="color:${color};font-weight:500">${stage}</span></div>
    <div class="modal-row"><span style="color:#888">Next review</span><span>${next}</span></div>
    <div class="modal-row"><span style="color:#888">Accuracy</span><span>${acc!==null?acc+"%":"—"}</span></div>
    <div class="modal-row"><span style="color:#888">Article</span><span>${w.article||"—"}</span></div>
    <button class="modal-close btn-secondary" onclick="closeModal()">Close</button>
  </div></div>`;
}

function renderLesson(app){
  const word=lessonQueue[lessonIdx];
  if(lessonPhase==="learn"){
    app.innerHTML=`<div class="session-wrap">
      <div class="session-header">
        <button class="btn-back" onclick="screen='dashboard';render()">← back</button>
        <span style="font-size:13px;color:#888">${lessonIdx+1} / ${lessonQueue.length}</span>
      </div>
      <div style="text-align:center">
        <div class="direction-label">Lesson</div>
        <div class="big-word">${word.dutch}</div>
        ${word.article?`<div style="color:#888;font-size:16px;margin-bottom:4px">${word.article} ${word.dutch}</div>`:""}
        <div style="font-size:24px;color:#888;margin:1rem 0 2rem">${word.english}</div>
        <button id="next-btn" class="check-btn" style="background:#8a5cf6" onclick="advanceLesson()">I know this →</button>
      </div>
    </div>`;
    setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
    return;
  }
  const isMeaning=lessonPhase==="quiz-meaning";
  const prompt=isMeaning?word.dutch:word.english;
  const placeholder=isMeaning?"Type English meaning…":"Type Dutch word…";
  const dirLabel=isMeaning?"🇳🇱 Dutch → English":"🇬🇧 English → Dutch";
  const phaseNum=isMeaning?"1":"2";
  const nextLabel=lessonIdx+1<lessonQueue.length||!isMeaning?"Next →":"Finish lessons";
  const btnColor=feedback?(feedback.correct?"#16a34a":"#dc2626"):"#8a5cf6";
  app.innerHTML=`<div class="session-wrap">
    <div class="session-header">
      <button class="btn-back" onclick="screen='dashboard';render()">← back</button>
      <span style="font-size:13px;color:#888">${lessonIdx+1} / ${lessonQueue.length} · Quiz ${phaseNum}/2</span>
    </div>
    <div style="text-align:center">
      <div class="direction-label">${dirLabel}</div>
      <div class="big-word">${prompt}</div>
      <div class="prompt-label">${isMeaning?"What is the English meaning?":"How do you write this in Dutch?"}</div>
      <input id="answer-input" type="text" class="${feedback?(feedback.correct?"correct":"wrong"):""}" value="${input.replace(/"/g,'&quot;')}" placeholder="${placeholder}" ${feedback?"disabled":""}/>
      ${feedback?`<div class="feedback ${feedback.correct?"correct":"wrong"}">${feedback.correct?"✓ Correct!":"✗ Wrong — correct answer: "+feedback.answer}</div>`:""}
      <button id="next-btn" class="check-btn" style="background:${btnColor}" onclick="submitLesson()">${feedback?nextLabel:"Check →"}</button>
    </div>
  </div>`;
  if(!feedback){
    const inp=document.getElementById("answer-input");
    inp.focus();
    inp.addEventListener("input",e=>input=e.target.value);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submitLesson(); }});
  } else {
    setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
  }
}

function renderReview(app){
  const{word,type}=reviewQueue[reviewIdx];
  const prompt=type==="meaning"?word.dutch:word.english;
  const label=type==="meaning"?"What is the English meaning?":"How do you write this in Dutch?";
  const sc=STAGE_COLORS[SRS_STAGES[progress[word.id].stage]]||"#888";
  const btnColor=feedback?(feedback.correct?"#16a34a":"#dc2626"):"#2563eb";
  const nextLabel=reviewIdx+1<reviewQueue.length?"Next →":"Finish reviews";
  app.innerHTML=`<div class="session-wrap">
    <div class="session-header">
      <button class="btn-back" onclick="screen='dashboard';render()">← back</button>
      <span style="font-size:13px;color:#888">${reviewIdx+1} / ${reviewQueue.length}</span>
      <span class="stage-badge" style="background:${sc}22;color:${sc}">${SRS_STAGES[progress[word.id].stage]}</span>
    </div>
    <div style="text-align:center">
      <div class="direction-label">${type==="meaning"?"🇳🇱 Dutch → English":"🇬🇧 English → Dutch"}</div>
      <div class="big-word">${prompt}</div>
      <div class="prompt-label">${label}</div>
      <input id="answer-input" type="text" class="${feedback?(feedback.correct?"correct":"wrong"):""}" value="${input.replace(/"/g,'&quot;')}" placeholder="${type==="meaning"?"Type English meaning…":"Type Dutch word…"}" ${feedback?"disabled":""}/>
      ${feedback?`<div class="feedback ${feedback.correct?"correct":"wrong"}">${feedback.correct?"✓ Correct!":"✗ Wrong — correct answer: "+feedback.answer}${!feedback.correct&&type==="dutch"&&word.article?`<br><small>Article: ${word.article}</small>`:""}</div>`:""}
      <button id="next-btn" class="check-btn" style="background:${btnColor}" onclick="submitReview()">${feedback?nextLabel:"Check →"}</button>
    </div>
    <div class="stats-bar">
      <span>✓ ${sessionCorrect}</span>
      <span>✗ ${sessionTotal-sessionCorrect}</span>
      <span>${sessionTotal>0?Math.round(sessionCorrect/sessionTotal*100):0}%</span>
    </div>
  </div>`;
  if(!feedback){
    const inp=document.getElementById("answer-input");
    inp.focus();
    inp.addEventListener("input",e=>input=e.target.value);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submitReview(); }});
  } else {
    setTimeout(()=>document.getElementById("next-btn")?.focus(),50);
  }
}

async function init(){
  try{ const r=await fetch("words.json"); VOCAB=await r.json(); }catch(e){ VOCAB=[]; }
  load(); initProgress(); render();
}
init();
if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
</script>
</body>
</html>
